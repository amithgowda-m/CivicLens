version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civiclens-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civiclens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiclens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-civiclens_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civiclens} -d ${POSTGRES_DB:-civiclens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
